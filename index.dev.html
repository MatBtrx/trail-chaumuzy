<h1 style="font-family:'DM Serif Display',serif;font-size:38px;line-height:1.1;margin:0 0 8px">Trail de Chaumuzy 2027</h1>
<p style="font-size:19px;color:#5c5247;margin:0 0 24px">Dimanche 4 avril 2027 - Foyer Rural de Chaumuzy (51170), Montagne de Reims, Champagne. Première édition organisée par Marne Outdoor Expériences.</p>
<h2 style="font-family:'DM Serif Display',serif;font-size:26px;margin:32px 0 8px">Les parcours</h2>
<ul>
<li><strong>Trail Expérience - 24 km</strong> (D+ 445 m, 29 km-effort) : départ à 09h30, barrière horaire 3h45. Réservé aux coureurs nés en 2007 et avant.</li>
<li><strong>Trail Découverte - 18 km</strong> (D+ 338 m, 22 km-effort) : départ à 10h00, barrière horaire 2h40. Ouvert aux coureurs nés en 2009 et avant.</li>
</ul>
<p>Deux boucles chronométrées avec classement, tracées en milieu naturel sur les communes de Chaumuzy, Belval-sous-Châtillon, La Neuville-aux-Larris et Champlat-et-Boujacourt, au cœur du Parc naturel régional de la Montagne de Reims, à moins de 30 minutes de Reims et d'Épernay.</p>
<h2 style="font-family:'DM Serif Display',serif;font-size:26px;margin:32px 0 8px">Inscriptions</h2>
<p>Les inscriptions officielles ouvrent le <strong>30 octobre 2026 à 10h00</strong>, exclusivement en ligne, dans la limite de 200 dossards sur le 24 km et 300 sur le 18 km. Une licence FFA (Athlé Compétition, Running ou Entreprise) ou une attestation Pass Prévention Santé de moins d'un an est obligatoire.</p>
<h2 style="font-family:'DM Serif Display',serif;font-size:26px;margin:32px 0 8px">Contact</h2>
<p>Marne Outdoor Expériences - <a href="mailto:marne.outdoor.experiences@gmail.com" style="color:#9A6B1E">marne.outdoor.experiences@gmail.com</a></p>
