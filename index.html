    { "@type": "Question", "name": "Comment puis-je m'inscrire ?", "acceptedAnswer": { "@type": "Answer", "text": "Les inscriptions officielles ouvrent le 30 octobre 2026 à 10h00, exclusivement en ligne, dans la limite des quotas : 200 dossards sur le 24 km et 300 sur le 18 km. Aucune inscription n'est prise sur place." } },
    { "@type": "Question", "name": "Quels documents dois-je fournir ?", "acceptedAnswer": { "@type": "Answer", "text": "Une licence FFA en cours de validité (Athlé Compétition, Athlé Running ou Athlé Entreprise) ou une attestation Pass Prévention Santé (PPS) de moins d'un an, avec une pièce d'identité au retrait du dossard. Les licences FSCF, FSGT et UFOLEP mention athlétisme sont acceptées." } },
    { "@type": "Question", "name": "Où et quand retirer mon dossard ?", "acceptedAnswer": { "@type": "Answer", "text": "Au Foyer Rural de Chaumuzy (33 rue du Capitaine Chesnais), le dimanche 4 avril 2027 de 7h00 à 9h00. Aucun dossard n'est délivré après 9h00 ni envoyé par courrier." } },
    { "@type": "Question", "name": "Où se garer le jour de la course ?", "acceptedAnswer": { "@type": "Answer", "text": "Un parking gratuit est fléché à proximité de la zone départ et arrivée, à Chaumuzy. Le covoiturage est recommandé : l'accès au village est limité le matin de l'épreuve." } },
    { "@type": "Question", "name": "Combien y a-t-il de ravitaillements ?", "acceptedAnswer": { "@type": "Answer", "text": "Un point de ravitaillement sur chaque parcours, à La Neuville-aux-Larris, et un ravitaillement complet à l'arrivée au Foyer Rural de Chaumuzy. Aucun gobelet jetable n'est fourni." } },
    { "@type": "Question", "name": "Le matériel est-il imposé ?", "acceptedAnswer": { "@type": "Answer", "text": "Oui, les épreuves se courent en semi-autonomie. Sont obligatoires : couverture de survie, réserve d'eau d'au moins 0,5 L, téléphone mobile chargé, sifflet, gobelet réutilisable personnel et dossard visible. Chaque élément manquant entraîne une pénalité de 5 minutes." } },
    { "@type": "Question", "name": "Y a-t-il un âge minimum ?", "acceptedAnswer": { "@type": "Answer", "text": "Le Trail 24 km est réservé aux Espoirs (U23) et au-delà, soit les coureurs nés en 2007 et avant. Le Trail 18 km est ouvert aux Juniors (U20) et au-delà, soit les coureurs nés en 2009 et avant." } },
    { "@type": "Question", "name": "Y a-t-il une barrière horaire ?", "acceptedAnswer": { "@type": "Answer", "text": "Oui : 3h45 de course sur le 24 km et 2h40 sur le 18 km. Au-delà, le concurrent est mis hors course et suit les consignes des serre-files." } },
    { "@type": "Question", "name": "Puis-je annuler ou céder mon dossard ?", "acceptedAnswer": { "@type": "Answer", "text": "Non. L'engagement est personnel, ferme et définitif : l'inscription ne bénéficie d'aucun droit de rétractation et n'ouvre droit à aucun remboursement. Le dossard est incessible." } },
    { "@type": "Question", "name": "Proposez-vous une offre pour les entreprises ?", "acceptedAnswer": { "@type": "Answer", "text": "Oui, un Pack entreprise à 50 € par dossard avec inscription centralisée, facture unique et visibilité de marque. Réservez un rendez-vous de 30 minutes." } }

<h1 style="font-family:'DM Serif Display',serif;font-size:38px;line-height:1.1;margin:0 0 8px">Trail de Chaumuzy 2027</h1>
<p style="font-size:19px;color:#5c5247;margin:0 0 24px">Dimanche 4 avril 2027 - Foyer Rural de Chaumuzy (51170), Montagne de Reims, Champagne. Première édition organisée par Marne Outdoor Expériences.</p>
<h2 style="font-family:'DM Serif Display',serif;font-size:26px;margin:32px 0 8px">Les parcours</h2>
<ul>
<li><strong>Trail Expérience - 24 km</strong> (D+ 445 m, 29 km-effort) : départ à 09h30, barrière horaire 3h45. Réservé aux coureurs nés en 2007 et avant.</li>
<li><strong>Trail Découverte - 18 km</strong> (D+ 338 m, 22 km-effort) : départ à 10h00, barrière horaire 2h40. Ouvert aux coureurs nés en 2009 et avant.</li>
</ul>
<p>Deux boucles chronométrées avec classement, tracées en milieu naturel sur les communes de Chaumuzy, Belval-sous-Châtillon, La Neuville-aux-Larris et Champlat-et-Boujacourt, au cœur du Parc naturel régional de la Montagne de Reims, à moins de 30 minutes de Reims et d'Épernay.</p>
<h2 style="font-family:'DM Serif Display',serif;font-size:26px;margin:32px 0 8px">Inscriptions</h2>
<p>Les inscriptions officielles ouvrent le <strong>30 octobre 2026 à 10h00</strong>, exclusivement en ligne, dans la limite de 200 dossards sur le 24 km et 300 sur le 18 km. Une licence FFA (Athlé Compétition, Running ou Entreprise) ou une attestation Pass Prévention Santé de moins d'un an est obligatoire.</p>
