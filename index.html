<!-- Données structurées FAQ (Google rich result) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Comment puis-je m'inscrire ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Les inscriptions officielles ouvrent le mercredi 28 octobre 2026 à 10h00, exclusivement en ligne sur la plateforme Miles Republic, dans la limite de 500 dossards : 200 sur le 23 km et 300 sur le 15 km. Aucune inscription n'est prise sur place. Votre inscription est validée après paiement, acceptation du règlement et envoi de votre licence ou PPS. En attendant, laissez votre e-mail via le formulaire de pré-inscription : vous serez prévenu(e) en priorité dès l'ouverture."
      }
    },
    {
      "@type": "Question",
      "name": "Quels documents dois-je fournir ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Au choix : une licence FFA Athlé Compétition, Athlé Running ou Athlé Entreprise en cours de validité (les licences Santé, Encadrement et Découverte ne sont pas acceptées), ou une attestation Pass Prévention Santé (PPS) délivrée par la FFA sur pps.athle.fr, datée de moins d'un an. Les licences FSCF, FSGT et UFOLEP mention « athlétisme » sont également acceptées. Les licences étrangères ne le sont pas : les coureurs étrangers doivent fournir un PPS. Le document est demandé à l'inscription, et au plus tard au retrait du dossard."
      }
    },
    {
      "@type": "Question",
      "name": "Où et quand retirer mon dossard ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Au Foyer Rural de Chaumuzy (33 rue du Capitaine Chesnais), le dimanche 4 avril 2027 de 7h00 à 9h00 pour le 23 km et de 7h00 à 10h00 pour le 15 km, sur présentation d'une pièce d'identité et de votre licence ou PPS. Aucun dossard n'est délivré après ces horaires ni envoyé par courrier. Le retrait par un tiers est possible avec une procuration et les pièces du participant. Le dossard se porte visible sur le devant, ceinture porte-dossard acceptée, sans être plié ni masqué."
      }
    },
    {
      "@type": "Question",
      "name": "Où se garer le jour de la course ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Un parking gratuit est fléché à proximité de la zone départ et arrivée, à Chaumuzy. Nous vous recommandons le covoiturage : l'accès au village est limité le matin de l'épreuve. Chaumuzy se situe au cœur de la Montagne de Reims, à environ 30 minutes de Reims et d'Épernay."
      }
    },
    {
      "@type": "Question",
      "name": "Combien y a-t-il de ravitaillements ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Un point de ravitaillement sur chaque parcours, à La Neuville-aux-Larris (Place du Général de Gaulle) : eau, boissons énergétiques, fruits secs et fruits frais. Un ravitaillement complet vous attend à l'arrivée, au Foyer Rural de Chaumuzy. Chacun remplit lui-même son contenant : aucun gobelet jetable n'est fourni. Les déchets se jettent uniquement dans les zones de propreté, de 20 m avant à 100 m après le ravitaillement."
      }
    },
    {
      "@type": "Question",
      "name": "Le matériel est-il imposé ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, les épreuves se courent en semi-autonomie. Sont obligatoires sur les deux parcours : couverture de survie, réserve d'eau d'au moins 0,5 L, téléphone mobile chargé avec le numéro du PC course enregistré et le son activé, sifflet, gobelet ou contenant réutilisable personnel, et dossard visible sur le devant. Chaque élément manquant entraîne une pénalité de 5 minutes. Conseillés : réserve alimentaire, veste coupe-vent, casquette ou gants selon la météo, petite trousse de premiers soins. Les bâtons sont autorisés, à conserver du départ à l'arrivée. Les écouteurs sont tolérés si vous restez audible des consignes."
      }
    },
    {
      "@type": "Question",
      "name": "Y a-t-il un âge minimum ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, selon les catégories d'âge FFA appliquées au kilomètre-effort. Le Trail 23 km (27 km-effort) est réservé aux Espoirs (U23) et au-delà, soit les coureurs nés en 2007 et avant. Le Trail 15 km (18 km-effort) est ouvert aux Juniors (U20) et au-delà, soit les coureurs nés en 2009 et avant. La catégorie est contrôlée à l'inscription et au retrait du dossard : toute inscription non conforme est refusée, sans remboursement."
      }
    },
    {
      "@type": "Question",
      "name": "Y a-t-il une barrière horaire ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui : 3h30 de course sur le 23 km et 2h30 sur le 15 km. Au-delà, le concurrent est mis hors course : il suit les consignes des serre-files et remet son dossard et sa puce. Tout abandon doit être signalé au plus tôt à un membre de l'organisation."
      }
    },
    {
      "@type": "Question",
      "name": "Les courses sont-elles chronométrées ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, par puce électronique, avec un classement pour chaque épreuve. Les résultats officiels sont publiés en ligne à l'issue de la course. Sont récompensés, sans cumul, les trois premiers hommes et les trois premières femmes au scratch de chaque épreuve, ainsi que le premier et la première de chaque catégorie d'âge. Les distances n'étant pas officielles au sens FFA, elles ne permettent ni record ni points au classement des clubs."
      }
    },
    {
      "@type": "Question",
      "name": "Que se passe-t-il en cas de mauvais temps ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "En début de printemps, la météo peut être changeante : pluie, vent, sols glissants. En cas de force majeure ou de danger pour les coureurs, l'organisation peut modifier les parcours, les horaires ou les barrières horaires, neutraliser une portion, reporter ou annuler l'épreuve. Aucun remboursement ne peut alors être exigé ; selon les circonstances, un report, un avoir ou un remboursement partiel pourra être proposé."
      }
    },
    {
      "@type": "Question",
      "name": "Les accompagnants peuvent-ils suivre les coureurs ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Non. Pour des raisons de sécurité, les suiveurs, accompagnants à vélo, poussettes et animaux, même tenus en laisse, sont interdits sur les parcours. Les ravitaillements organisés par des proches en dehors des zones prévues sont interdits et passibles de mise hors course. Vos supporters sont les bienvenus sur la zone départ et arrivée."
      }
    },
    {
      "@type": "Question",
      "name": "Puis-je annuler ou céder mon dossard ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "L'engagement est personnel, ferme et définitif : l'inscription ne bénéficie d'aucun droit de rétractation (article L.221-28 du Code de la consommation) et n'ouvre droit à aucun remboursement de la part de l'organisateur. En revanche, si vous ne pouvez plus participer, vous pouvez céder votre dossard via la plateforme Miles Republic : c'est la seule voie autorisée. Tout échange en dehors de la plateforme expose le porteur et le titulaire initial à la mise hors course. Une assurance annulation facultative peut être proposée à l'inscription."
      }
    },
    {
      "@type": "Question",
      "name": "Proposez-vous une offre pour les entreprises ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui. Le Pack entreprise (50 € / dossard) permet d'engager une équipe avec inscription centralisée, facture unique et visibilité de votre marque."
      }
    }
  ]
}
</script>
