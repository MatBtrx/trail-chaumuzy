<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inscription confirmée - Trail de Chaumuzy 2027</title>
<meta name="description" content="Votre inscription à la liste d'attente du Trail de Chaumuzy 2027 est confirmée." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hifi.css" />
<style>
  :root{ --display:'DM Serif Display',serif; --text:'DM Sans',system-ui,sans-serif; --disp-tr:none; --disp-wt:400; --disp-tk:0; }
  body{ background:var(--ink); color:var(--on-ink); min-height:100svh; display:flex; flex-direction:column; }
  .merci-nav{ display:flex; align-items:center; padding:16px 32px; border-bottom:1px solid var(--hair-on-ink); }
  .merci-nav img{ height:34px; width:auto; }
  .merci-main{ flex:1; display:flex; align-items:center; justify-content:center; padding:48px 24px; text-align:center; }
  .merci-card{ max-width:560px; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .merci-check{ width:88px; height:88px; border-radius:50%; background:rgba(232,99,28,.14); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .merci-eyebrow{ font-family:var(--text); font-weight:700; text-transform:uppercase; letter-spacing:.22em; font-size:13px; color:var(--gold); }
  .merci-card h1{ font-family:var(--display); font-weight:var(--disp-wt); text-transform:uppercase; letter-spacing:.01em; font-size:clamp(46px,9vw,78px); line-height:.9; margin:0; color:var(--on-ink); }
  .merci-card p{ color:var(--on-ink-2); font-size:18px; line-height:1.6; margin:0; max-width:480px; }
  .merci-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  @media (max-width:560px){ .merci-actions{ flex-direction:column; width:100%; } .merci-actions .btn{ width:100%; justify-content:center; } }
</style>
</head>
<body>
  <header class="merci-nav">
    <a href="index.html" aria-label="Accueil Trail de Chaumuzy"><img src="assets/logo-trail-chaumuzy-white.png" alt="Logo officiel du Trail de Chaumuzy" /></a>
  </header>
  <main class="merci-main">
    <div class="merci-card">
      <div class="merci-check">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
      </div>
      <div class="merci-eyebrow">Liste d'attente</div>
      <h1>Inscription<br />confirmée&nbsp;!</h1>
      <p>Merci&nbsp;! Votre adresse e-mail est validée. Vous serez prévenu(e) en priorité dès l'ouverture des inscriptions, en octobre 2026. À très vite sur les sentiers de Chaumuzy.</p>
      <div class="merci-actions">
        <a class="btn btn-primary" href="index.html">Retour au site</a>
        <a class="btn btn-gold" href="index.html#programme">Voir le programme</a>
      </div>
    </div>
  </main>
</body>
</html>
